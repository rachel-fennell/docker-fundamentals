# task-api/src/main/resources/application.yml
spring:
  application:
    name: task-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    version: ${APP_VERSION:1.0.0}
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs